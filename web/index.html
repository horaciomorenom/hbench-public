* { box-sizing: border-box; }

header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 18px; padding: 10px 20px; flex-wrap: wrap; }
header .brand { font-weight: 700; font-size: 16px; }
nav a { margin-right: 14px; color: var(--mute); font-weight: 500; } nav a.on { color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; background: var(--code); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); display: inline-block; }
.dot.up { background: var(--good); } .dot.live { background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.spacer { flex: 1; }

.meter i { display: block; height: 100%; background: var(--good); }
main { max-width: 1400px; margin: 0 auto; padding: 18px 20px 60px; }
h1 { font-size: 20px; margin: 4px 0 12px; } h2 { font-size: 15px; margin: 22px 0 8px; } h3 { font-size: 14px; margin: 14px 0 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.muted { color: var(--mute); } .small { font-size: 12px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--mute); font-weight: 600; }
.matrix td, .matrix th { text-align: center; white-space: nowrap; } .matrix td:first-child, .matrix th:first-child { text-align: left; }
.cell { display: inline-block; min-width: 54px; padding: 3px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.cell.good { background: var(--good-bg); color: var(--good); } .cell.mid { background: var(--mid-bg); color: var(--mid); }
.cell.bad { background: var(--bad-bg); color: var(--bad); } .cell.none { color: var(--mute); }
.cell .sub { display: block; font-size: 11px; opacity: .8; }
.scroll { overflow-x: auto; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 14px 0 0; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 8px 12px; color: var(--mute); cursor: pointer; border-bottom: 2px solid transparent; font: inherit; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; padding: 14px 16px; min-height: 200px; }
pre, code { font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
pre.log { max-height: 70vh; }
code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
pre code { background: none; padding: 0; }
.md h1, .md h2, .md h3 { margin-top: 14px; }
.md blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--mute); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.md table { width: auto; margin: 6px 0; } .md td, .md th { border: 1px solid var(--line); }
.reason .md { max-width: 900px; line-height: 1.55; } .reason .md p { margin: 0 0 10px; }
.t-think .md { font-style: normal; color: var(--think); } .t-think .md p { margin: 0 0 8px; }
.rtool { position: sticky; top: 52px; background: var(--panel); z-index: 2; padding: 4px 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); color: var(--mute); padding: 5px 10px; cursor: pointer; font: inherit; }
.seg button.on { background: var(--code); color: var(--ink); }
mark { background: #ffe58a; color: inherit; border-radius: 2px; } mark.cur { background: #ffb020; }
@media (prefers-color-scheme: dark) { mark { background: #5c4a12; } mark.cur { background: #8a6410; } }
pre code.hljs { background: transparent; padding: 0; }
.t-cmd { display: inline; font: 12.5px ui-monospace, Menlo, monospace; }
.t-edit { margin: 4px 0 4px 14px; }
.t-edit pre { margin: 2px 0; border-left: 3px solid var(--line); }
.t-edit pre.old { border-left-color: var(--bad); opacity: .8; } .t-edit pre.new { border-left-color: var(--good); }
.t-edit .lbl { font-size: 11px; color: var(--mute); }
.diff .add { color: var(--good); } .diff .del { color: var(--bad); } .diff .hunk { color: var(--accent); } .diff .file { font-weight: 700; }
button.btn, select, input[type=number], input[type=text] { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
button.btn { cursor: pointer; background: var(--accent); color: #fff; border-color: var(--accent); }
button.btn.ghost { background: var(--panel); color: var(--ink); border-color: var(--line); }
button.btn.danger { background: var(--bad); border-color: var(--bad); }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
button.btn.sm { padding: 2px 9px; font-size: 12px; }
input[type=time] { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
#hdr-queue { display: inline-flex; align-items: center; gap: 6px; }
.qstate { font-weight: 600; } .qstate.run { color: var(--good); } .qstate.wait { color: var(--mid); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
label { color: var(--mute); font-size: 12px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.t-block { margin: 6px 0; }
.t-think { color: var(--think); font-style: italic; white-space: pre-wrap; }
.t-think summary, .t-res summary { cursor: pointer; color: var(--mute); font-style: normal; font-size: 12px; }
.t-text { white-space: pre-wrap; }
.t-tool { color: var(--tool); font: 12.5px ui-monospace, Menlo, monospace; margin-top: 10px; word-break: break-word; }
.t-res pre { max-height: 360px; } .t-res.err pre { color: var(--bad); }
.t-turn { font-size: 11px; color: var(--mute); border-top: 1px dashed var(--line); padding-top: 3px; margin-top: 8px; }
.t-sys { font-weight: 600; font-size: 12px; margin: 8px 0; }
.t-prompt { background: var(--code); border-left: 3px solid var(--accent); padding: 4px 14px; border-radius: 4px; }
.files { display: grid; grid-template-columns: minmax(220px, 340px) 1fr; gap: 12px; }
.files .list { max-height: 72vh; overflow: auto; font: 12px ui-monospace, Menlo, monospace; }
.files .list div { padding: 2px 4px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
.files .list div:hover, .files .list div.on { background: var(--code); }
.toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; max-width: 460px; z-index: 9; }
.ok { color: var(--good); } .no { color: var(--bad); }
figure.fig { margin: 8px 0; } figure.fig img { max-width: min(100%, 720px); background: #fff; border: 1px solid var(--line); border-radius: 6px; }
figure.fig figcaption { font-size: 12px; color: var(--mute); }
.follow { font-size: 12px; color: var(--mute); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; margin: 10px 0 14px; }
.chart { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 6px; background: var(--panel); }
.chart h4 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
.chart .cap { font-size: 11px; color: var(--mute); margin-bottom: 4px; }
.chart svg { display: block; width: 100%; height: 190px; overflow: visible; }
.chart svg text { font-size: 11px; fill: var(--mute); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--grid); stroke-width: 1; } .chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--series); stroke: var(--panel); stroke-width: 2; }
.chart .bar { fill: var(--series); } .chart .bar.hot { fill: var(--series-hot); }
.chart .xh { stroke: var(--mute); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .mk { stroke: var(--ink); stroke-opacity: .55; stroke-width: 1; stroke-dasharray: 4 3; }
.chart svg text.mkl { fill: var(--ink); font-weight: 600; font-size: 10.5px; }
.starts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; margin: 4px 0 2px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
  font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; z-index: 3; }
.tip b { font-size: 13px; } .tip div { color: var(--mute); }
.tiles { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 120px; background: var(--panel); }
.tile .v { font-size: 20px; font-weight: 600; } .tile .l { font-size: 12px; color: var(--mute); }
@media (max-width: 720px) { .files, .charts { grid-template-columns: 1fr; } main { padding: 12px 16px 40px; } header { padding: 8px 16px; gap: 8px 12px; }
  header .spacer, #hdr-job { display: none; } header .pill { white-space: normal; } .meter { width: 50px; } }

<script>
// ------------------------------------------------------------ basics
const $ = (s, el = document) => el.querySelector(s);

const api = async (path, body) => {
  const r = await fetch("/api/" + path, body ? { method: "POST", headers: { "Content-Type": "application/json", "X-HBench": "1" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const toast = msg => { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 5000); };
const fmtS = s => s == null ? "" : s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s / 60)}m` : `${(s / 3600).toFixed(1)}h`;

let timers = [];
const every = (fn, ms) => { fn(); timers.push(setInterval(fn, ms)); };

    f95: "fortran", f03: "fortran", f08: "fortran", nml: "fortran", sh: "bash", bash: "bash", zsh: "bash", slurm: "bash", sbatch: "bash", json: "json", yaml: "yaml", yml: "yaml",

// Markdown: fences, headings, lists, tables, quotes, rules, bold, inline code, links, paragraphs.

const CODE_START = /^\s*(def |class |import |from \S+ import |return\b|for .+:\s*$|while .+:\s*$|if .+:\s*$|elif .+:\s*$|else:\s*$|try:\s*$|except\b.*:\s*$|with .+:\s*$|#include|#define|#pragma|@\w+|print\(|raise |yield |assert |pass\s*$|break\s*$|continue\s*$|[}{]\s*$|(int|double|float|void|auto|const|static|std::)\b.*[;{)]\s*$|(subroutine|function|program|module|end\s+(do|if|subroutine|function|module|program))\b|do \w+\s*=)/i;

// Unfenced code in reasoning is short and messy, so pick the language from clear signs before falling back to auto-detection.
const guessLang = c => /^\s*(subroutine|program|module|end\s+(do|if|subroutine)|real\s*\(|integer\s*::)/im.test(c) ? "fortran"
  : /#include|std::|;\s*$|^\s*(int|double|float|void|auto)\s+\w/m.test(c) ? "cpp"
  : /^\s*(def |class |import |from \S+ import |for .+:\s*$|if .+:\s*$|elif |print\(|return\b)/m.test(c) ? "python" : null;

// imgBase: a runs/ folder that relative images (a line "![caption](file.png)") are served from.

    }

      flush(); const body = [l];

        if (!n.trim() && i + 2 < lines.length && /^\s+\S/.test(lines[i + 2]) && isCode(lines[i + 2].trim())) { body.push(n); i++; continue; }

      const code = body.join("\n"), lang = guessLang(code);

    }

    if (im) { flush(); out.push(`<figure class="fig"><img src="/api/image?path=${encodeURIComponent(`${imgBase}/${im[2]}`)}" alt="${esc(im[1])}"><figcaption>${esc(im[1])}</figcaption></figure>`); continue; }

}
// Reasoning view: rendered/raw toggle, search with match count (Enter = next), size readout.
function reasoningView(pane, text) {

  const words = text.split(/\s+/).filter(Boolean).length;
  pane.innerHTML = `<div class="row rtool"><span class="seg"><button class="on" data-m="r">Rendered</button><button data-m="raw">Raw</button></span>
    <input type="text" placeholder="search reasoning" class="rq" style="width:220px"><span class="small muted rc"></span><span class="spacer"></span>
    <span class="small muted">${compact(text.length)} chars · ${compact(words)} words · ${text.split(/\n\s*\n/).length} paragraphs</span></div><div class="rbody reason"></div>`;
  const body = $(".rbody", pane), qin = $(".rq", pane), rc = $(".rc", pane);
  let mode = "r", hits = [], at = -1;
  const draw = () => { body.innerHTML = mode === "r" ? md(text, { breaks: true, autocode: true }) : `<pre class="log">${esc(text)}</pre>`; mark(); };

    hits[at].classList.add("cur"); hits[at].scrollIntoView({ block: "center" }); rc.textContent = `${at + 1} / ${hits.length}`; };

}

// TAB: a tab named in the URL (#/fast/<model>/<item>/<tab>, the same for latex, #/long/<model>/<case>/<tab>); base: the page's hash,
// so a tab click updates the URL without reloading the view.
let TAB = null;

// ------------------------------------------------------------ live log and transcript followers
function tailer(pane, path, { live = true, title = "" } = {}) {
  pane.innerHTML = `${title}<div class="row follow"><label><input type="checkbox" checked> follow</label><span class="st"></span></div><pre class="log"></pre>`;
  const pre = $("pre", pane), st = $(".st", pane), fol = $("input", pane);
  let offset = -1, stopped = false;
  const tick = async () => {
    if (stopped) return;
    try {
      const r = await api("tail?" + q({ path, offset }));
      if (!r.exists) { st.textContent = `${path} does not exist yet`; return; }
      if (r.data) {
        pre.append(r.data);
        if (pre.textContent.length > 600000) pre.textContent = "…\n" + pre.textContent.slice(-400000);
        if (fol.checked) pre.scrollTop = pre.scrollHeight;
      }
      offset = r.offset; st.textContent = `${path} · ${(r.size / 1024).toFixed(1)} KB${live ? " · live" : ""}`;
    } catch (e) { st.textContent = e.message; }
  };
  tick(); const id = live ? setInterval(tick, 2000) : null;
  return () => { stopped = true; clearInterval(id); };
}
function transcriptView(pane, path, live) {
  pane.innerHTML = `<div class="row follow"><label><input type="checkbox" ${live ? "checked" : ""}> follow</label>
    <label><input type="checkbox" class="th"> expand thinking</label><span class="st"></span></div><div class="tr"></div>`;
  const box = $(".tr", pane), st = $(".st", pane), fol = $("input", pane), th = $(".th", pane);
  let offset = 0, blocks = {}, lastBlock = null, stopped = false, nTools = 0, nTurns = 0; const toolOf = {};
  th.onchange = () => box.querySelectorAll("details.t-think").forEach(d => d.open = th.checked);
  const render = ev => {
    for (const e of ev) {
      // Blocks are keyed by pi's contentIndex: a reply's text can start before its thinking block ends.
      if (e.t === "open") {
        let b;
        if (e.k === "thinking") { b = document.createElement("details"); b.className = "t-block t-think"; b.open = th.checked || live;
          b.innerHTML = "<summary>thinking</summary><div></div>"; box.append(b); b.body = $("div", b); }
        else { b = document.createElement("div"); b.className = "t-block t-text"; box.append(b); b.body = b; }
        blocks[e.i ?? "x"] = b; lastBlock = b;
      } else if (e.t === "add") {
        let b = blocks[e.i ?? "x"] || lastBlock;
        if (!b) { b = document.createElement("div"); b.className = "t-block t-text"; box.append(b); b.body = b; blocks[e.i ?? "x"] = lastBlock = b; }
        b.body.append(e.s);
      } else if (e.t === "close") {
        const b = blocks[e.i ?? "x"] || lastBlock;
        if (b) { const raw = b.body.textContent, think = b.tagName === "DETAILS";
          if (raw.trim()) b.body.innerHTML = md(raw, { breaks: true, autocode: think });
          if (think) { $("summary", b).textContent = `thinking (${raw.length} chars)`; if (!th.checked) b.open = false; } }
        delete blocks[e.i ?? "x"]; if (b === lastBlock) lastBlock = null;
      }
      else if (e.t === "tool") { nTools++; if (e.id) toolOf[e.id] = e; const d = document.createElement("div"); d.className = "t-tool";
        const head = e.name === "bash" && e.command ? `▶ <b>bash</b>: <code class="t-cmd hljs">${hl(e.command, "bash")}</code>` : `▶ <b>${esc(e.name)}</b>: ${esc(e.shown)}`;
        let body = "";
        if (e.edits) body = e.edits.map((x, i) => `<details class="t-edit" open><summary class="lbl">edit ${e.edits.length > 1 ? i + 1 : ""} · −${x.old.split("\n").length} +${x.new.split("\n").length} lines</summary>` +
          `${codeBlock(x.old, langOf(e.path), false, "old")}${codeBlock(x.new, langOf(e.path), false, "new")}</details>`).join("");
        else if (e.content != null) body = `<details class="t-edit"><summary class="lbl">content · ${e.content.split("\n").length} lines</summary>${codeBlock(e.content, langOf(e.path), false, "new")}</details>`;
        else if (e.extra) body = `<details><summary>arguments</summary>${codeBlock(e.extra, "json")}</details>`;
        d.innerHTML = head + body; box.append(d); }
      else if (e.t === "result") { const lines = e.s.split("\n"); const d = document.createElement("details"); d.className = "t-res" + (e.err ? " err" : "");
        const src = toolOf[e.id], lang = !e.err && (e.name || src?.name) === "read" ? langOf(src?.path) : null;
        d.open = lines.length <= 12; d.innerHTML = `<summary>${e.err ? "error · " : ""}result · ${lines.length} lines</summary>` + (lang ? codeBlock(e.s, lang) : `<pre>${esc(e.s)}</pre>`); box.append(d); }
      else if (e.t === "turn") { nTurns++; blocks = {}; lastBlock = null; const d = document.createElement("div"); d.className = "t-turn";
        d.innerHTML = `turn ${nTurns}: ${e.inp} in / ${e.cached} cached / ${e.out} out · stop=${esc(e.stop)}` + (e.err ? ` <span class="no">${esc(e.err)}</span>` : ""); box.append(d); }
      else if (e.t === "prompt") { const d = document.createElement("div"); d.className = "t-prompt"; d.innerHTML = md(e.s); box.append(d); }
      else if (e.t === "sys") { const d = document.createElement("div"); d.className = "t-sys"; d.textContent = "■ " + e.s; box.append(d); }
    }

      if (r.events.length) { render(r.events); if (fol.checked) window.scrollTo(0, document.body.scrollHeight); }
      offset = r.offset; st.textContent = `${nTurns} turns · ${nTools} tool calls${live ? " · live" : ""}`;
    } catch (e) { st.textContent = e.message; }
  };
  tick(); const id = live ? setInterval(tick, 2500) : null;
  return () => { stopped = true; clearInterval(id); };
}
const textPane = (path, fmt = "pre") => async pane => {

    pane.innerHTML = r.binary ? `<p class="muted">binary file, ${r.size} bytes</p>` : fmt === "md" ? md(r.text) : fmt === "diff" ? diffHtml(r.text)
      : fmt === "code" && langOf(path) ? codeBlock(r.text, langOf(path), false, "log") : `<pre class="log">${esc(r.text)}</pre>`;

// ------------------------------------------------------------ queue (../jobq.py)
// "HH:MM" from an <input type=time> -> epoch seconds of its next occurrence
const atEpoch = v => { if (!v) return null; const [h, m] = v.split(":").map(Number); const d = new Date(); d.setHours(h, m, 0, 0);
  if (d <= new Date()) d.setDate(d.getDate() + 1); return d.getTime() / 1000; };

const PAUSE_MSG = "Pause now?\n\nThe running job is killed and its current run is lost: a fast or LaTeX run redoes the item it was on (finished items are kept), "
  + "a long case reruns from scratch. It goes back to the front of the queue, the model server is stopped to free the memory, and nothing runs until you resume.";
async function queueOp(body, ask) {
  if (ask && !confirm(ask)) return;

}

function queueSummary(Q) {
  const n = queued(Q);
  const st = Q.paused ? (Q.start_at ? `starts ${dayTime(Q.start_at)}` : "paused") : "running";
  return `queue ${st} · ${n} waiting${Q.pause_at ? ` · pauses ${dayTime(Q.pause_at)}` : ""}`;
}
$("#hdr-queue").onclick = e => {
  if (e.target.id === "hdr-pause") queueOp({ op: "pause" }, PAUSE_MSG);
  if (e.target.id === "hdr-resume") queueOp({ op: "start" });
};

  $("#hdr-mem").textContent = `${m.level}% · swap ${m.swap_used}`; $("#hdr-mempill").title = m.what || "free memory";
  const bar = $("#hdr-mem-bar"); bar.style.width = m.level + "%"; bar.style.background = m.level < 8 ? "var(--bad)" : m.level < 15 ? "var(--mid)" : "var(--good)";
  const j = STATUS.jobs[0];

// ------------------------------------------------------------ server log charts
const median = a => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y); const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };

function timeTicks(a, b, n = 5) {
  const span = b - a, steps = [60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600]; const st = steps.find(s => span / s <= n) || 43200;
  const out = []; for (let t = Math.ceil(a / st) * st; t <= b; t += st) out.push(t); return out;
}
// One chart: kind line (time x), scatter (numeric x) or bars (request order). pts: [{x, y, tip: [strong, ...lines]}]
function chart(box, { title, cap, kind, pts, xTime, xLabel, yFmt = compact, gapBreak, marks = [] }) {
  const el = document.createElement("div"); el.className = "chart"; box.append(el);
  el.innerHTML = `<h4></h4><div class="cap"></div>`; $("h4", el).textContent = title; $(".cap", el).textContent = cap || "";
  if (!pts.length) { el.insertAdjacentHTML("beforeend", '<p class="muted small">No data in this window.</p>'); return; }
  // Draw after layout: all chart shells are in the grid by then, so each measures its real width.
  requestAnimationFrame(() => drawChart(el, { title, kind, pts, xTime, yFmt, gapBreak, marks }));
}
// marks: run starts. Time charts get them at their time; bar charts (request order) before the first request of the run.
function drawChart(el, { title, kind, pts, xTime, yFmt, gapBreak, marks }) {
  const W = Math.max(280, el.clientWidth - 24), H = 190, L = 44, R = 10, T = marks.length ? 30 : 8, B = 24, pw = W - L - R, ph = H - T - B;
  const ys = niceTicks(Math.max(...pts.map(p => p.y)) * 1.05), ymax = ys.at(-1);
  let x0, x1, X;
  if (kind === "bars") { X = i => L + (i + 0.5) * pw / pts.length; }
  else { x0 = Math.min(...pts.map(p => p.x), ...marks.map(m => m.x)); x1 = Math.max(...pts.map(p => p.x)); if (x1 === x0) { x0 -= 30; x1 += 30; } if (!xTime) x0 = 0;
    X = v => L + (v - x0) / (x1 - x0) * pw; }
  const Y = v => T + ph - v / ymax * ph;
  let g = ys.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`).join("");
  g += `<line class="base" x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}"/>`;
  if (kind === "bars") { const every = Math.ceil(pts.length / 8); pts.forEach((p, i) => { if (i % every === 0) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${i + 1}</text>`; }); }
  else if (xTime) timeTicks(x0, x1).forEach(t => g += `<text x="${X(t)}" y="${H - 6}" text-anchor="middle">${hhmm(t)}</text>`);
  else niceTicks(x1, 5).filter(v => v <= x1 * 1.02).forEach(v => g += `<text x="${X(v)}" y="${H - 6}" text-anchor="middle">${compact(v)}</text>`);
  let lastX = -1e9, row = 0;
  for (const m of marks) {
    const mx = kind === "bars" ? L + m.i * pw / pts.length : X(m.x);
    if (mx < L - 1 || mx > W - R + 1) continue;
    row = mx - lastX < 70 ? 1 - row : 0; lastX = mx;
    g += `<g><title>${esc(m.title)}</title><line class="mk" x1="${mx}" x2="${mx}" y1="${T - 18 + row * 11}" y2="${T + ph}"/>` +
      `<text class="mkl" x="${mx > W - R - 40 ? mx - 3 : mx + 3}" text-anchor="${mx > W - R - 40 ? "end" : "start"}" y="${T - 10 + row * 11}">${esc(m.label)}</text></g>`;
  }
  let marks_ = "";
  if (kind === "line") {
    let d = "", prev = null;
    for (const p of pts) { d += (prev && !(gapBreak && p.x - prev.x > gapBreak) ? "L" : "M") + X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1); prev = p; }
    marks_ = `<path class="ln" d="${d}"/>`;
    if (pts.length < 60) marks_ += pts.map(p => `<circle class="pt" r="4" cx="${X(p.x)}" cy="${Y(p.y)}"/>`).join("");
  } else if (kind === "scatter") marks_ = pts.map(p => `<circle class="pt" r="4" cx="${X(p.x)}" cy="${Y(p.y)}"/>`).join("");
  else { const bw = Math.max(1, pw / pts.length - 2);
    marks_ = pts.map((p, i) => `<rect class="bar" data-i="${i}" x="${X(i) - bw / 2}" y="${Y(p.y)}" width="${bw}" height="${Math.max(0, T + ph - Y(p.y))}" rx="${bw >= 6 ? 2 : 0}"/>`).join(""); }
  el.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}${marks_}<line class="xh" y1="${T}" y2="${T + ph}" style="display:none"/><rect class="hit" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/></svg>`);
  const svg = $("svg", el), xh = $(".xh", svg), tip = document.createElement("div"); tip.className = "tip"; tip.style.display = "none"; el.append(tip);
  let hot = null;
  const hide = () => { tip.style.display = "none"; xh.style.display = "none"; if (hot) hot.classList.remove("hot"); hot = null; };
  $(".hit", svg).addEventListener("pointerleave", hide);
  $(".hit", svg).addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), mx = (ev.clientX - r.left) * W / r.width, my = (ev.clientY - r.top) * H / r.height;
    let best = null, bd = Infinity, bi = -1;
    pts.forEach((p, i) => { const px = kind === "bars" ? X(i) : X(p.x), d = kind === "scatter" ? Math.hypot(px - mx, Y(p.y) - my) : Math.abs(px - mx); if (d < bd) { bd = d; best = p; bi = i; } });
    if (!best || (kind === "scatter" && bd > 30)) return hide();
    const px = kind === "bars" ? X(bi) : X(best.x);
    if (kind === "line") { xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.display = ""; }
    if (kind === "bars") { if (hot) hot.classList.remove("hot"); hot = svg.querySelector(`rect[data-i="${bi}"]`); hot.classList.add("hot"); }
    tip.replaceChildren(); const [strong, ...rest] = best.tip; const b = document.createElement("b"); b.textContent = strong; tip.append(b);
    for (const line of rest) { const d = document.createElement("div"); d.textContent = line; tip.append(d); }
    tip.style.display = ""; const left = px * r.width / W + 12 + 12, maxL = el.clientWidth - tip.offsetWidth - 4;
    tip.style.left = Math.min(left, maxL) + "px"; tip.style.top = (Y(best.y) * r.height / H + 30) + "px";
  });
}
// Stat tiles + three charts + table for one model's server log, optionally limited to a run's time window.
function serverPane(model, win, live) {
  return pane => {
    pane.innerHTML = `<div class="sc"><p class="muted">loading…</p></div><div class="lg"></div>`;
    const sc = $(".sc", pane); let stopped = false, showTable = false, last = null;
    const stopTail = tailer($(".lg", pane), `runs/server-${model}.log`, { live, title: '<h3>Raw log</h3>' });
    const draw = S => {
      if (!S.exists) { sc.innerHTML = `<p class="muted">No server log for ${esc(model)} (runs/server-${esc(model)}.log is written by server.sh up and replaced on each start).</p>`; return; }
      if (S.kind === "none") { sc.innerHTML = `<p class="muted">This server's log has no per-request timings (bmoe-server doesn't print them), so there is nothing to chart.</p>`; return; }
      const R = S.requests, llama = S.kind === "llama";
      const startsBefore = i => S.starts.filter(m => (i === 0 || R[i - 1].t0 < m.t - 2) && (i === R.length || R[i].t0 >= m.t - 2));
      const outTok = R.reduce((a, r) => a + (r.gen_n || 0), 0), busy = R.reduce((a, r) => a + (r.t - r.t0), 0);
      const dec = median(R.filter(r => r.gen_tps).map(r => r.gen_tps));
      const pre = llama ? median(R.filter(r => r.prompt_tps && r.prompt_n >= 64).map(r => r.prompt_tps)) : median(R.map(r => r.ttft));
      const scope = win ? `this run's window (${hhmm(win.start)}–${win.end ? hhmm(win.end) : "now"})` : `since the server started at ${hhmmss(S.started)}`;
      const tiles = [["Requests", compact(R.length)], ["Output tokens", compact(outTok)], ["Median decode", dec == null ? "–" : `${dec.toFixed(1)} t/s`],
        llama ? ["Median prompt reading", pre == null ? "–" : `${compact(pre)} t/s`] : ["Median TTFT", pre == null ? "–" : `${pre.toFixed(1)} s`],
        ["Busy time", fmtS(busy) || "0s"]];
      if (S.guard) tiles.push(["Lowest free memory", `${S.guard.min_level}%`]);
      sc.innerHTML = `<div class="row small muted">Server log for ${esc(model)}, ${scope}${live ? " · live" : ""} <button class="btn ghost tb" style="padding:2px 8px;font-size:12px">${showTable ? "Charts" : "Table"}</button></div>
        <div class="tiles">${tiles.map(([l, v]) => `<div class="tile"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>
        ${S.starts.length ? `<div class="starts"><span class="muted">Runs started (dashed lines):</span>${S.starts.map(m =>
          `<a class="pill" href="${esc(m.link)}">${hhmm(m.t)} · <b>${esc(m.label)}</b> <span class="muted">${esc(m.detail)}</span></a>`).join("")}</div>` : ""}<div class="charts"></div>`;
      $(".tb", sc).onclick = () => { showTable = !showTable; draw(last); };
      const box = $(".charts", sc);
      if (showTable) {
        box.style.display = "block";
        box.innerHTML = `<div class="scroll"><table><tr><th>end</th><th>new prompt tokens</th>${llama ? "<th>prompt t/s</th>" : "<th>cached</th><th>TTFT</th>"}<th>output tokens</th><th>decode t/s</th><th>duration</th></tr>${R.map((r, i) => startsBefore(i).map(m =>
          `<tr><td colspan="7"><b>▸ ${esc(m.label)}</b> started ${hhmmss(m.t)} <span class="muted">${esc(m.detail)}</span></td></tr>`).join("") +
          `<tr><td>${hhmmss(r.t)}</td><td>${r.prompt_n ?? ""}</td>${llama ? `<td>${r.prompt_tps ?? ""}</td>` : `<td>${r.cached}</td><td>${r.ttft}s</td>`}<td>${r.gen_n ?? ""}</td><td>${r.gen_tps ?? ""}</td><td>${fmtS(r.t - r.t0)}</td></tr>`).join("")}${startsBefore(R.length).map(m =>
          `<tr><td colspan="7"><b>▸ ${esc(m.label)}</b> started ${hhmmss(m.t)} <span class="muted">${esc(m.detail)} (no request finished yet)</span></td></tr>`).join("")}</table></div>`;
        return;
      }
      const timeMarks = S.starts.map(m => ({ x: m.t, label: m.label, title: `${m.detail} · started ${hhmmss(m.t)}` }));
      const P = S.progress.length ? S.progress.map(p => ({ x: p.t, y: p.tps, tip: [`${p.tps.toFixed(1)} t/s`, hhmmss(p.t), `${p.n} tokens into the reply`] }))
        : R.filter(r => r.gen_tps).map(r => ({ x: r.t, y: r.gen_tps, tip: [`${r.gen_tps} t/s`, `request ending ${hhmmss(r.t)}`, `${r.gen_n} output tokens`] }));
      chart(box, { title: "Decode speed", cap: S.progress.length ? "tokens per second over the last 3 s, sampled while generating" : "tokens per second, one point per request", kind: "line", pts: P, xTime: true, gapBreak: 15, marks: timeMarks });
      if (llama) chart(box, { title: "Prompt reading speed by prompt size", cap: "tokens per second vs new (uncached) prompt tokens, one dot per request", kind: "scatter",
        pts: R.filter(r => r.prompt_tps).map(r => ({ x: r.prompt_n, y: r.prompt_tps, tip: [`${compact(r.prompt_tps)} t/s`, `${r.prompt_n} new prompt tokens`, `in ${(r.prompt_ms / 1000).toFixed(1)} s · ${hhmmss(r.t0)}`] })) });
      else chart(box, { title: "Time to first token by prompt size", cap: "seconds vs new (uncached) prompt tokens, one dot per request", kind: "scatter", yFmt: v => v + "s",
        pts: R.map(r => ({ x: r.prompt_n, y: r.ttft, tip: [`${r.ttft} s`, `${r.prompt_n} new prompt tokens (${r.cached} cached)`, hhmmss(r.t)] })) });
      const BR = R.filter(r => r.gen_n != null);
      const barMarks = S.starts.map(m => { const i = BR.findIndex(r => r.t0 >= m.t - 2); return { i: i < 0 ? BR.length : i, label: m.label, title: `${m.detail} · started ${hhmmss(m.t)}` }; });
      chart(box, { title: "Output tokens per request", cap: "in request order", kind: "bars", marks: barMarks,
        pts: BR.map((r, i) => ({ y: r.gen_n, tip: [`${r.gen_n.toLocaleString()} tokens`, `request ${i + 1}, ended ${hhmmss(r.t)}`, `${fmtS(r.t - r.t0)} · ${r.gen_tps} t/s`] })) });
    };
    const tick = async () => {
      if (stopped) return;
      try { last = await api("server_stats?" + q({ model, ...(win ? { since: win.start } : {}), ...(win && win.end ? { until: win.end } : {}) })); draw(last); }
      catch (e) { sc.innerHTML = `<p class="no">${esc(e.message)}</p>`; }
    };
    tick(); const id = live ? setInterval(tick, 5000) : null;
    const rs = () => last && draw(last); window.addEventListener("resize", rs);
    return () => { stopped = true; clearInterval(id); stopTail(); window.removeEventListener("resize", rs); };
  };
}

// ------------------------------------------------------------ views
const cls = (s, mx) => s == null || !mx ? "none" : s / mx >= 0.9 ? "good" : s / mx >= 0.5 ? "mid" : "bad";
const judgeStr = j => j ? ` [${j.score}/${j.max}]` : "";

const tierItems = (R, tier) => (tier === "latex" ? R.latex_items : R.items) || [];

async function viewResults(main) {
  main.innerHTML = `<h1>Results</h1><div id="res"><p class="muted">loading…</p></div>`;
  const draw = async () => {
    const R = await api("results");
    let h = "";
    for (const [tier, heading] of [["fast", "Fast tier · short suite (29 checks)"], ["latex", "LaTeX tier · one-shot documents (137 checks)"]]) {
    const rows = R[tier] || {}, listed = tierItems(R, tier);
    const items = listed.length ? listed : [...new Set(Object.values(rows).flatMap(r => Object.keys(r.items)))].sort().map(id => ({ id, title: id }));
    h += `<div class="card"><h2 style="margin-top:0">${heading}</h2><div class="scroll"><table class="matrix"><tr><th>model</th><th>total</th>${items.map(i => `<th title="${esc(i.title)}">${i.id}</th>`).join("")}</tr>`;
    for (const [m, r] of Object.entries(rows)) {
      const t = r.total;
      h += `<tr><td><a href="#/${tier}/${m}">${esc(m)}</a> ${r.live ? '<span class="dot live" title="running"></span>' : ""}</td>
        <td>${t ? `<span class="cell ${cls(t.score, t.max)}"><b>${t.score}/${t.max}</b><span class="sub">${fmtS(t.seconds)} · ${t.truncated.length} trunc${t.attempts_max > 1 ? ` · mean of ${t.attempts === t.attempts_max ? t.attempts : `${t.attempts}–${t.attempts_max}`}` : ""}</span></span>` : '<span class="cell none">–</span>'}</td>`;
      for (const it of items) {
        const c = r.items[it.id] || { status: "missing" };
        let body, k = "none";
        const reps = (c.attempt_scores || []).length > 1 ? `<span class="sub">${c.attempt_scores.join(" · ")}</span>` : "";
        const tip = (c.attempt_scores || []).length > 1 ? ` title="mean of ${c.attempt_scores.length} attempts: ${c.attempt_scores.join(", ")}"` : "";
        if (c.status === "graded") { k = cls(c.auto, c.max); body = `<span${tip}>${c.pending ? '<span class="dot live"></span> ' : ""}${c.auto}/${c.max}${judgeStr(c.judge)}${c.truncated ? " T" : ""}</span>${reps || `<span class="sub">${fmtS(c.seconds)}</span>`}`; }
        else if (c.status === "ungraded") body = `answered${c.truncated ? " T" : ""}<span class="sub">${fmtS(c.seconds)} · ${c.tokens} tok</span>`;
        else if (c.status === "running") body = `<span class="dot live"></span> running`;
        else if (c.status === "incomplete") body = "incomplete";
        else body = "–";
        h += `<td>${c.status === "missing" ? `<span class="cell none">–</span>` : `<a href="#/${tier}/${m}/${it.id}"><span class="cell ${k}">${body}</span></a>`}</td>`;
      }
      h += "</tr>";
    }
    h += `</table></div><p class="small muted">T = hit the token limit · [judge score] from review.json · "answered" = not graded yet (grading runs when the suite finishes) · with several attempts the cell shows their mean, and each attempt's score below it</p></div>`;
    }
    h += `<div class="card"><h2 style="margin-top:0">Long tier · agentic cases</h2><div class="scroll"><table class="matrix"><tr><th>model</th>${R.cases.map(c => `<th>${c}</th>`).join("")}</tr>`;
    for (const [m, r] of Object.entries(R.long)) {
      h += `<tr><td>${esc(m)}</td>`;
      for (const c of R.cases) {
        const x = r[c];
        if (!x) { h += `<td><span class="cell none">–</span></td>`; continue; }
        const L = x.latest;
        let body, k = "none";
        if (x.live) body = `<span class="dot live"></span> running`;
        else if (L) { k = L.score == null ? "bad" : cls(L.score, L.max);
          body = `${L.score == null ? "err" : `${L.score}/${L.max}`}${L.status !== "completed" ? "*" : ""}${L.task_version ? "†" : ""}${judgeStr(x.judge)}<span class="sub">${Math.round(L.seconds / 60)}m${x.runs > 1 ? ` · ${x.runs} runs` : ""}</span>`; }
        else body = "no result";
        h += `<td><a href="#/long/${m}/${c}"><span class="cell ${k}">${body}</span></a></td>`;
      }
      h += "</tr>";
    }
    h += `</table></div><p class="small muted">* timeout or agent error · † graded on an earlier task version (not comparable) · c cases: sanity /40, judge in [ ]</p></div>`;
    $("#res").innerHTML = h;
  };
  every(draw, 10000);
}

async function filesView(pane, root) {
  pane.innerHTML = `<div class="files"><div><input type="text" placeholder="filter" style="width:100%;margin-bottom:6px"><div class="list"></div></div><div class="view muted">Pick a file.</div></div>`;
  const list = $(".list", pane), view = $(".view", pane), flt = $("input", pane);
  const files = await api("tree?" + q({ path: root }));
  const draw = () => { const f = flt.value.toLowerCase(); list.innerHTML = files.filter(x => x.path.toLowerCase().includes(f)).map(x =>
    `<div data-p="${esc(x.path)}" title="${x.size} bytes">${esc(x.path.slice(root.length + 1))}</div>`).join("") || '<span class="muted">no files</span>'; };
  flt.oninput = draw; draw();

// "Save as PDF" for a judge packet: app.py renders it (pandoc + headless Chrome) and the browser downloads it.
const pdfButton = path => `<div class="row" style="justify-content:flex-end;margin-top:0"><button class="btn ghost sm" data-pdf="${esc(path)}">Save as PDF</button></div>`;
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-pdf]"); if (!b) return;
  b.disabled = true; b.textContent = "Making PDF…";
  try {
    const r = await fetch("/api/pdf?" + q({ path: b.dataset.pdf }));
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const name = (r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/)?.[1] || "judge-packet.pdf";
    const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000); toast(`saved ${name}`);
  } catch (err) { toast(err.message); }
  b.disabled = false; b.textContent = "Save as PDF";
});

async function stopJob(pid, mode) {
  const msg = mode === "agent" ? "Stop the agent now? long.sh then grades what it has (status agent_exit_143)."
    : "Abort this job? The agent and the script are killed; nothing is graded. A fast or LaTeX run resumes later from the next unfinished item.";
  if (!confirm(msg)) return;
  try { const r = await api("stop", { pid, mode }); toast(r.message); setTimeout(() => { refreshStatus(); route(); }, 1500); } catch (e) { toast(e.message); }
}

    <p class="small muted">Jobs run one at a time, in order; add them from <a href="#/launch">Launch</a> (or <code>jobq.py add</code> in a shell). The queue

      or a shell; that run is lost (a fast or LaTeX run redoes the item it was on, a long case reruns from scratch). The job goes back to the front of the
      queue and the model server is stopped. When the queue runs out it stops the server and pauses itself. While it works it keeps the Mac
      awake (macOS <code>caffeinate -is</code>, on AC power; Linux <code>systemd-inhibit</code>; off on WSL, so set Windows not to sleep while plugged in). It keeps running if this page or the UI

  <div id="jr"></div><div id="jh"></div>`;
  const qBody = $("#q-items");
  qBody.onclick = e => { const b = e.target.closest("[data-q]"); if (!b) return;
    const [op, id] = b.dataset.q.split(":"); queueOp(op === "rm" ? { op: "remove", id } : { op: "move", id, dir: op }, op === "rm" ? "Remove this job from the queue?" : null); };
  $("#q-start").onclick = () => queueOp({ op: "start" });

  $("#q-state").onclick = e => { const b = e.target.closest("[data-cancel]"); if (b) queueOp({ op: b.dataset.cancel }); };
  const drawQueue = Q => {
    const n = queued(Q), live = STATUS.jobs.length > 0;
    const cls = !Q.paused ? "run" : Q.start_at ? "wait" : "";
    const html = `<span class="qstate ${cls}">${Q.paused ? (Q.start_at ? `Waiting to start at ${dayTime(Q.start_at)}` : "Paused") : "Running"}</span>
      ${Q.note ? `<span class="muted">(${esc(Q.note)})</span>` : ""} <span class="muted">· ${n} waiting · runner ${Q.runner_alive ? "up" : "not running"}</span>
      ${Q.start_at ? `<button class="btn ghost sm" data-cancel="cancel_start_at">cancel start</button>` : ""}
      ${Q.pause_at ? `<span class="muted">· pauses at ${dayTime(Q.pause_at)}</span> <button class="btn ghost sm" data-cancel="cancel_pause_at">cancel pause</button>` : ""}`;
    if ($("#q-state").dataset.h !== html) { $("#q-state").innerHTML = html; $("#q-state").dataset.h = html; }

    $("#q-start").textContent = Q.paused && Q.items.some(i => (i.tries || 0) > 0 && i.status === "queued") ? "Resume" : "Start now";
    $("#q-pause").disabled = !live && Q.paused;

      <td>${status(i)}</td><td class="small">${esc(i.note || "")}</td><td class="small">${esc(new Date(i.added * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }))}</td>
      <td>${i.job ? `<a href="#/job/${i.job}">log</a>` : ""}</td>
      <td style="white-space:nowrap">${i.status === "queued" ? `<button class="btn ghost sm" data-q="up:${i.id}" title="move up">↑</button> <button class="btn ghost sm" data-q="down:${i.id}" title="move down">↓</button> <button class="btn ghost sm" data-q="rm:${i.id}">remove</button>`
        : i.status !== "running" ? `<button class="btn ghost sm" data-q="rm:${i.id}">remove</button>` : ""}</td></tr>`).join("")}</table></div>` : '<p class="muted">Empty. Add jobs from <a href="#/launch">Launch</a>.</p>';
    if (qBody.dataset.h !== t) { qBody.innerHTML = t; qBody.dataset.h = t; }

  const draw = () => {

    $("#jr").innerHTML = `<div class="card"><h2 style="margin-top:0">Running</h2>${S.jobs.length ? `<div class="scroll"><table><tr><th>job</th><th>elapsed</th><th>phase</th><th>started from</th><th></th></tr>${S.jobs.map(j => {

    $("#jh").innerHTML = `<div class="card"><h2 style="margin-top:0">Started from this UI or the queue</h2>${S.recent.length ? `<div class="scroll"><table><tr><th>id</th><th>command</th><th>env</th><th>exit</th></tr>${S.recent.map(j =>

    main.querySelectorAll("[data-stop]").forEach(b => b.onclick = () => stopJob(+b.dataset.stop, b.dataset.mode));
    main.querySelectorAll("[data-pause]").forEach(b => b.onclick = () => queueOp({ op: "pause" }, PAUSE_MSG));
  };
  draw(); document.addEventListener("status", draw); timers.push({ off: () => document.removeEventListener("status", draw) });
}

}

function viewServer(main) {
  const M = Object.keys(STATUS?.models || {});
  main.innerHTML = `<h1>Server</h1><div class="card"><div id="sv"></div>
    <div class="row"><select id="s-model">${M.map(m => `<option>${m}</option>`).join("")}</select><button class="btn" id="s-up">Start (server.sh up)</button>
    <button class="btn danger" id="s-down">Stop (server.sh down)</button></div>
    <p class="small muted">One model server at a time. Start runs config.json's <code>before_start</code> hook (if set), then the model's serve script (under the <code>wrap</code> hook, if set). Models without a serve script are external: hbench only checks that they answer.</p></div><div id="slog"></div>`;
  const draw = () => { const s = STATUS?.server; if (!s) return;
    $("#sv").innerHTML = s.up_ports.length ? `<p><span class="dot up"></span> <b>${esc(s.model || "unknown")}</b> on :${s.up_ports.join(", ")}</p>` : `<p class="muted">No server up.</p>`;
    $("#s-up").disabled = !!s.up_ports.length || !!STATUS.jobs.length; };
  draw(); document.addEventListener("status", draw); timers.push({ off: () => document.removeEventListener("status", draw) });
  const sel = $("#s-model"); if (STATUS?.server.recorded && M.includes(STATUS.server.recorded)) sel.value = STATUS.server.recorded;
  let stopLog = () => {};
  const showLog = () => { stopLog(); stopLog = serverPane(sel.value, null, true)($("#slog")); };
  sel.onchange = showLog; showLog(); timers.push({ off: () => stopLog() });
  $("#s-up").onclick = async () => { try { const r = await api("launch", { kind: "server_up", model: sel.value }); toast("starting " + sel.value); location.hash = `#/job/${r.id}`; } catch (e) { toast(e.message); } };
  $("#s-down").onclick = async () => {
    if (STATUS?.jobs.length && !confirm("A job is running and needs this server. Stop the server anyway?")) return;
    try { await api("launch", { kind: "server_down" }); toast("stopping server"); setTimeout(refreshStatus, 3000); } catch (e) { toast(e.message); } };
}

// ------------------------------------------------------------ router
let stopView = () => {};
async function route() {
  timers.forEach(t => t.off ? t.off() : clearInterval(t)); timers = []; stopView();
  if (!STATUS) await refreshStatus();
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  TAB = ["fast", "latex", "long"].includes(parts[0]) && parts.length === 4 ? parts[3] : null;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === (parts[0] && ["launch", "jobs", "server"].includes(parts[0]) ? parts[0] : parts[0] === "job" ? "jobs" : "")));
  const main = $("#main");
  try {
    if (!parts.length) await viewResults(main);
    else if (["fast", "latex"].includes(parts[0]) && parts.length === 2) await viewFastModel(main, parts[1], parts[0]);
    else if (["fast", "latex"].includes(parts[0])) await viewFastItem(main, parts[1], parts[2], parts[0]);
    else if (parts[0] === "long") await viewLong(main, parts[1], parts[2]);
    else if (parts[0] === "launch") viewLaunch(main);
    else if (parts[0] === "jobs") viewJobs(main);
    else if (parts[0] === "job") viewJob(main, parts[1]);
    else if (parts[0] === "server") viewServer(main);
    else main.innerHTML = "<p>Not found.</p>";
  } catch (e) { main.innerHTML = `<p class="no">${esc(e.message)}</p>`; }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
